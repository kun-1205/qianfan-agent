<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f2b46"/>
      <stop offset="100%" stop-color="#2563a8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L7,3.2 z" fill="#5a7a99"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L7,3.2 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="880" height="520" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="40" y="42" font-size="19" font-weight="700" fill="#0f2b46">健身减脂 AI 教练 · 系统架构</text>
  <line x1="40" y1="56" x2="840" y2="56" stroke="#d7e0ea" stroke-width="1.5"/>

  <!-- 输入 -->
  <rect x="330" y="76" width="220" height="46" rx="8" fill="#eef4fb" stroke="#b9d2ea" stroke-width="1.5"/>
  <text x="440" y="98" font-size="13.5" font-weight="700" fill="#1d4e8a" text-anchor="middle">用户输入</text>
  <text x="440" y="114" font-size="11" fill="#5a7a99" text-anchor="middle">身体数据 / 目标 / 饮食禁忌</text>

  <!-- 箭头 1 -->
  <line x1="440" y1="122" x2="440" y2="150" stroke="#5a7a99" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 安全前置检查 -->
  <rect x="250" y="152" width="380" height="76" rx="8" fill="#fef2f2" stroke="#e8a5a5" stroke-width="1.8"/>
  <text x="440" y="176" font-size="13.5" font-weight="700" fill="#991b1b" text-anchor="middle">① 安全前置检查（最高优先级）</text>
  <text x="440" y="197" font-size="11" fill="#7f1d1d" text-anchor="middle">孕期 · 疾病 · 药物 · 术后 · 疼痛受伤 · 进食障碍 · 未成年 · 极端节食</text>
  <text x="440" y="215" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">命中任一项 → 转介医生 / 劝阻，不生成方案</text>

  <!-- 转介出口 -->
  <line x1="640" y1="190" x2="742" y2="190" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <rect x="744" y="167" width="106" height="46" rx="8" fill="#fbeaea" stroke="#d99a9a" stroke-width="1.5"/>
  <text x="797" y="186" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">转介专业</text>
  <text x="797" y="202" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">医疗意见</text>

  <!-- 箭头 2（通过） -->
  <line x1="440" y1="228" x2="440" y2="262" stroke="#5a7a99" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="452" y="249" font-size="10.5" fill="#1f7a45" font-weight="700">通过</text>

  <!-- Prompt 层 -->
  <rect x="60" y="264" width="200" height="72" rx="8" fill="#f0f7ff" stroke="#b9d2ea" stroke-width="1.5"/>
  <text x="160" y="288" font-size="12.5" font-weight="700" fill="#1d4e8a" text-anchor="middle">② Prompt 层</text>
  <text x="160" y="307" font-size="10.5" fill="#5a7a99" text-anchor="middle">角色设定 · 输出格式</text>
  <text x="160" y="323" font-size="10.5" fill="#5a7a99" text-anchor="middle">安全规则 · 任务拆解</text>

  <line x1="262" y1="300" x2="322" y2="300" stroke="#5a7a99" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- LLM -->
  <rect x="324" y="264" width="200" height="72" rx="8" fill="#eef4fb" stroke="#9fc0e2" stroke-width="1.8"/>
  <text x="424" y="290" font-size="12.5" font-weight="700" fill="#1d4e8a" text-anchor="middle">③ 千帆大模型</text>
  <text x="424" y="310" font-size="10.5" fill="#5a7a99" text-anchor="middle">LLM 推理 + 检索增强</text>
  <text x="424" y="326" font-size="10.5" fill="#5a7a99" text-anchor="middle">BMR / TDEE 计算约束</text>

  <line x1="526" y1="300" x2="586" y2="300" stroke="#5a7a99" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 输出 -->
  <rect x="588" y="264" width="200" height="72" rx="8" fill="#f0fdf4" stroke="#a8d8b9" stroke-width="1.5"/>
  <text x="688" y="288" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">④ 结构化输出</text>
  <text x="688" y="307" font-size="10.5" fill="#3f6b52" text-anchor="middle">训练计划 + 饮食餐单</text>
  <text x="688" y="323" font-size="10.5" fill="#3f6b52" text-anchor="middle">＋【注意事项】必备栏</text>

  <!-- 检索箭头（向下） -->
  <line x1="424" y1="338" x2="424" y2="378" stroke="#5a7a99" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="436" y="362" font-size="10.5" fill="#5a7a99" font-weight="700">向量检索</text>

  <!-- 知识库 -->
  <rect x="264" y="380" width="320" height="66" rx="8" fill="#f7f9fc" stroke="#c8d6e4" stroke-width="1.5"/>
  <text x="424" y="404" font-size="12.5" font-weight="700" fill="#334e68" text-anchor="middle">知识库（切片 → 向量化）</text>
  <text x="424" y="424" font-size="10.5" fill="#64748b" text-anchor="middle">营养学基础 · 训练原理 · 常见误区 · 食物热量表</text>

  <!-- 评估闭环 -->
  <rect x="60" y="392" width="170" height="56" rx="8" fill="#fffbeb" stroke="#e8cf8f" stroke-width="1.5"/>
  <text x="145" y="414" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">⑤ 效果评估</text>
  <text x="145" y="432" font-size="10.5" fill="#a16207" text-anchor="middle">65 条用例 · 九分类</text>

  <path d="M232 420 L258 420" stroke="#c9a227" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M145 390 L145 342 L58 342 L58 302 L56 302" stroke="#c9a227" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>
  <text x="88" y="336" font-size="10" fill="#a16207" font-weight="700">迭代优化</text>

  <!-- 底部说明 -->
  <text x="40" y="492" font-size="11" fill="#7b8794">核心设计：安全前置检查独立于生成流程 —— 高危场景在进入 LLM 之前就被拦截，而非依赖模型自觉。</text>
</svg>
